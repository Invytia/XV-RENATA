        body, html { margin: 0; padding: 0; font-family: 'Montserrat', sans-serif; background-color: #FAFAFA; color: #4A4A4A; }
        
        /* ----- VIDEO INTRO ----- */
        body.intro-active { overflow: hidden; }
        #video-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 9999; background: black; transition: opacity 0.8s ease; }
        #intro-pantalla { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 2; background-color: #ffffff; display: flex; justify-content: center; align-items: center; }
        #intro-pantalla img { width: 100%; height: 100%; object-fit: cover; }
        #intro-action-area { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); width: 60%; height: 15%; cursor: pointer; z-index: 3; }
        #introVideo { position: absolute; top: 0; left: 0; width: 100%; height: 100%; object-fit: cover; z-index: 1; }

        /* ----- CONTENEDOR PRINCIPAL ----- */
        .invitation-container { max-width: 500px; margin: 0 auto; background: #FDFBF7; padding-bottom: 40px; }

        /* ----- DIVISORES FLORALES (ESTRUCTURALES) ----- */
        .floral-divider { text-align: center; margin: 30px 0; padding: 10px 0; }
        .floral-divider img { width: 100%; max-width: 320px; height: auto; display: block; margin: 0 auto; }
        
        /* Estilo específico para las esquinas */
        .floral-corner { text-align: right; margin-top: -20px; margin-bottom: 10px; }
        .floral-corner img { width: 150px; height: auto; }

        /* ----- ESTILOS DE TEXTO ----- */
        h1, h2, h3, h4 { font-family: 'Cormorant Garamond', serif; color: #7D5BA6; margin: 0; font-weight: 600; text-align: center; }
        h3 { font-size: 1.8rem; margin-bottom: 15px; letter-spacing: 1px; text-transform: uppercase; }

        .hero-section img { width: 100%; height: auto; display: block; border-bottom-left-radius: 20px; border-bottom-right-radius: 20px; }
        .personal-message { text-align: center; padding: 0 35px; line-height: 1.8; color: #555; }

        /* ----- CALENDARIO, BOTONES, PASES (Mismo estilo funcional anterior) ----- */
        .date-section, .family-section, .locations-section, .passes-section { text-align: center; padding: 0 20px; }
        .date-hero { margin-bottom: 25px; }
        .day-number { font-family: 'Cormorant Garamond', serif; font-size: 5rem; color: #7D5BA6; line-height: 1; display: block; }
        
        .calendar { background: white; border-radius: 15px; padding: 25px; margin: 20px auto; max-width: 320px; border: 1px solid rgba(125, 91, 166, 0.1); }
        .calendar-days { display: grid; grid-template-columns: repeat(7, 1fr); gap: 10px; padding-top: 15px; }
        .calendar-highlight { background-color: #7D5BA6; color: white; border-radius: 50%; }

        .calendar-btn { display: inline-block; background-color: transparent; color: #7D5BA6; border: 1px solid #7D5BA6; padding: 12px 25px; border-radius: 30px; text-decoration: none; font-size: 0.85rem; }

        .ticket { background: #7D5BA6; width: 100%; max-width: 320px; border-radius: 20px; color: white; padding: 20px; text-align: center; }

        .rsvp-purple-block { background: #7D5BA6; color: white; padding: 40px 25px; border-radius: 20px; margin: 20px; text-align: center; }
        .rsvp-input { width: 85%; padding: 15px; border-radius: 30px; border: none; margin-bottom: 20px; text-align: center; }
        .rsvp-btn { background: white; color: #7D5BA6; border: none; padding: 15px 35px; border-radius: 30px; font-weight: 600; cursor: pointer; }

       const video = document.getElementById('introVideo');

        const introPantalla = document.getElementById('intro-pantalla');
        const actionArea = document.getElementById('intro-action-area');
        const introSong = document.getElementById('intro-song');

        function habilitarScroll() { document.body.classList.remove('intro-active'); }

        actionArea.addEventListener('click', () => {
            actionArea.style.display = 'none';
            let playPromise = video.play();
            if (playPromise !== undefined) {
                playPromise.then(_ => {
                    introPantalla.style.opacity = '0';
                    setTimeout(() => { introPantalla.style.display = 'none'; }, 800);
                    introSong.play();
                }).catch(error => {
                    console.error("Autoplay bloqueado:", error);
                    actionArea.style.display = 'block';
                });
            }
        });

        video.onended = () => {
            overlay.style.opacity = '0';
            introSong.pause(); 
            setTimeout(() => { overlay.style.display = 'none'; habilitarScroll(); }, 800);
        };

        const playBtn = document.getElementById('play-button');
        const quinceSong = document.getElementById('quince-song');
        const musicIcon = document.getElementById('music-icon');
        
        const svgPlay = '<path d="M112 111v290c0 17 19 28 35 19l242-145c16-9 16-31 0-40L147 92c-16-9-35 2-35 19z"/>';
        const svgPause = '<path d="M144 479H48c-26.5 0-48-21.5-48-48V81c0-26.5 21.5-48 48-48h96c26.5 0 48 21.5 48 48v350c0 26.5-21.5 48-48 48zm304 0h-96c-26.5 0-48-21.5-48-48V81c0-26.5 21.5-48 48-48h96c26.5 0 48 21.5 48 48v350c0 26.5-21.5 48-48 48z"/>';

        playBtn.addEventListener('click', () => {
            if (quinceSong.paused) {
                quinceSong.play();
                musicIcon.innerHTML = svgPause;
                musicIcon.setAttribute("viewBox", "0 0 448 512"); 
            } else {
                quinceSong.pause();
                musicIcon.innerHTML = svgPlay;
                musicIcon.setAttribute("viewBox", "0 0 512 512");
            }
        });

        const observerOptions = { threshold: 0.15, rootMargin: "0px 0px -50px 0px" };
        const observer = new IntersectionObserver((entries) => {
            entries.forEach(entry => {
                if(entry.isIntersecting) {
                    entry.target.classList.add('visible');
                    observer.unobserve(entry.target);
                }
            });
        }, observerOptions);

        document.querySelectorAll('.animate-on-scroll').forEach(el => { observer.observe(el); });

        function enviarWhatsApp() {
            const nombre = document.getElementById('guest-name').value.trim();
            if (nombre === "") {
                alert("Por favor, ingresa tu nombre y apellidos para confirmar.");
                return;
            }
            const numeroTel = "525632023012";
            const textoMensaje = encodeURIComponent(`¡Con mucho cariño, Renata! Confirmo mi asistencia a tus XV Años. Mi nombre es: ${nombre}. ¡Allí estaré!`);
            const urlWhatsApp = `https://wa.me/${numeroTel}?text=${textoMensaje}`;
            window.open(urlWhatsApp, '_blank');
        }

        function actualizarCountdown() {
            const fechaObjetivo = new Date('August 7, 2026 16:00:00').getTime();
            const ahora = new Date().getTime();
            const diferencia = fechaObjetivo - ahora;

            if (diferencia > 0) {
                const d = Math.floor(diferencia / (1000 * 60 * 60 * 24));
                const h = Math.floor((diferencia % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
                const m = Math.floor((diferencia % (1000 * 60 * 60)) / (1000 * 60));
                const s = Math.floor((diferencia % (1000 * 60)) / 1000);

                document.getElementById('days').innerText = d < 10 ? '0' + d : d;
                document.getElementById('hours').innerText = h < 10 ? '0' + h : h;
                document.getElementById('minutes').innerText = m < 10 ? '0' + m : m;
                document.getElementById('seconds').innerText = s < 10 ? '0' + s : s;
            }
        }
