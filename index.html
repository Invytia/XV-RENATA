<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        #video-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            z-index: 9999; background: black;
            display: flex; justify-content: center; align-items: center;
            transition: opacity 0.8s ease;
        }
        #introVideo { width: 100%; height: 100%; object-fit: cover; cursor: pointer; }
        
        /* Botón elegante sobre el video */
        #btn-entrar {
            position: absolute; padding: 15px 30px;
            background: rgba(255, 255, 255, 0.1); border: 1px solid white;
            color: white; font-family: sans-serif; cursor: pointer;
            z-index: 10000; border-radius: 5px; text-transform: uppercase;
        }
    </style>
</head>
<body>

    <div id="video-overlay">
        <div id="btn-entrar">Toca para abrir</div>
        <video id="introVideo" playsinline>
            <source src="xvrenata.mp4" type="video/mp4">
            Tu navegador no soporta el formato de video.
        </video>
    </div>

    <div id="invitacion-principal">
        <h1>Bienvenidos a mis XV Años</h1>
    </div>

    <script>
        const video = document.getElementById('introVideo');
        const overlay = document.getElementById('video-overlay');
        const btn = document.getElementById('btn-entrar');

        // 1. Detector de errores de carga de archivo
        video.addEventListener('error', function(e) {
            let errorMsg = e.target.error ? e.target.error.message : "Error desconocido";
            console.error("Error crítico cargando el video:", errorMsg);
            alert("Fallo al cargar el archivo de video. Revisa la consola de Chrome para ver el error exacto.");
        }, true);

        // 2. Lógica del botón de entrada con detector de errores de reproducción
        btn.addEventListener('click', () => {
            btn.style.display = 'none'; // Ocultar el botón
            
            // Intentar reproducir y atrapar cualquier bloqueo del navegador
            let playPromise = video.play();
            
            if (playPromise !== undefined) {
                playPromise.then(_ => {
                    // La reproducción comenzó correctamente
                    console.log("Reproducción iniciada con éxito.");
                })
                .catch(error => {
                    // El navegador bloqueó la reproducción
                    console.error("El navegador bloqueó el video:", error);
                    alert("El navegador bloqueó la reproducción. Revisa que el formato sea mp4 h.264 válido.");
                });
            }
        });

        // 3. Transición al finalizar el video
        video.onended = () => {
            overlay.style.opacity = '0';
            setTimeout(() => { overlay.style.display = 'none'; }, 800);
        };
    </script>
</body>
</html>
