<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Invitación Digital - Mis XV Años</title>
    <style>
        body, html {
            margin: 0; padding: 0; width: 100%; height: 100%;
            font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
            overflow: hidden; /* Previene scroll mientras se ve la intro y el video */
        }

        /* Contenedor principal del video y la imagen */
        #video-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            z-index: 9999; background: black;
            transition: opacity 0.8s ease;
        }

        /* La imagen de intro que cubre el video al inicio */
        #intro-pantalla {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            z-index: 2; /* Por encima del video */
            background-color: #ffffff; /* Fondo por si la imagen tarda unos ms en cargar */
            transition: opacity 0.8s ease;
            display: flex; justify-content: center; align-items: center;
        }

        #intro-pantalla img {
            width: 100%; height: 100%;
            object-fit: cover; /* Asegura que llene toda la pantalla del celular sin deformarse */
        }

        /* El botón invisible sobre el texto "TOCA PARA ABRIR" */
        #intro-action-area {
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            width: 60%;  /* Área amplia para asegurar que el dedo del usuario acierte en móvil */
            height: 15%; 
            background-color: transparent;
            cursor: pointer;
            z-index: 3;
            /* Descomenta la siguiente línea si quieres ver la caja roja para ajustar su tamaño/posición */
            /* border: 2px solid red; */
        }

        #introVideo { 
            position: absolute; top: 0; left: 0;
            width: 100%; height: 100%; object-fit: cover; 
            z-index: 1; /* Por debajo de la imagen, esperando a ser revelado */
        }
        
        /* Estilo editorial de la invitación principal */
        #invitacion-principal {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background: linear-gradient(to bottom, #ffffff, #FFD1DC); 
            color: #333;
        }

        h1 {
            font-size: 2.5rem;
            font-weight: 300;
            letter-spacing: 4px;
            color: #AEC6CF; 
            text-align: center;
            text-transform: uppercase;
            margin-bottom: 10px;
        }

        p {
            font-weight: 300;
            letter-spacing: 1px;
            color: #666;
        }
    </style>
</head>
<body>

    <div id="video-overlay">
        
        <div id="intro-pantalla">
            <img src="assets/intro.png" alt="Portada de la invitación">
            <div id="intro-action-area" title="Toca para abrir"></div>
        </div>

        <video id="introVideo" playsinline>
            <source src="https://invytia.github.io/XV-RENATA/xvrenata.mp4" type="video/mp4">
            Tu navegador no soporta el formato de video.
        </video>
    </div>

    <div id="invitacion-principal">
        <h1>Bienvenidos a mis XV Años</h1>
        <p>Aquí comienza la experiencia interactiva</p>
    </div>

    <script>
        const video = document.getElementById('introVideo');
        const overlay = document.getElementById('video-overlay');
        const introPantalla = document.getElementById('intro-pantalla');
        const actionArea = document.getElementById('intro-action-area');

        // Habilitar el scroll de nuevo una vez que se quita el video
        function habilitarScroll() {
            document.body.style.overflow = 'auto';
            document.documentElement.style.overflow = 'auto';
        }

        // Detector de errores de carga del video
        video.addEventListener('error', function(e) {
            let errorMsg = e.target.error ? e.target.error.message : "Error desconocido";
            console.error("Error crítico cargando el video:", errorMsg);
        }, true);

        // Lógica al tocar el área invisible de la imagen
        actionArea.addEventListener('click', () => {
            // 1. Ocultar el área de clic para evitar dobles toques
            actionArea.style.display = 'none';
            
            // 2. Intentar reproducir el video
            let playPromise = video.play();
            
            if (playPromise !== undefined) {
                playPromise.then(_ => {
                    console.log("Reproducción iniciada con éxito.");
                    // 3. Desvanecer la imagen de portada revelando el video
                    introPantalla.style.opacity = '0';
                    setTimeout(() => { 
                        introPantalla.style.display = 'none'; 
                    }, 800);
                })
                .catch(error => {
                    console.error("El navegador bloqueó el video:", error);
                    alert("Por favor, asegúrate de no estar en modo de ahorro de batería extremo.");
                    actionArea.style.display = 'block'; // Volver a mostrar si el usuario necesita volver a intentar
                });
            }
        });

        // Transición al finalizar el video para mostrar la invitación principal
        video.onended = () => {
            overlay.style.opacity = '0';
            setTimeout(() => { 
                overlay.style.display = 'none'; 
                habilitarScroll(); // Devolvemos el control al usuario para que navegue
            }, 800);
        };
    </script>
</body>
</html>
